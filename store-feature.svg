<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d7c0f"/>
      <stop offset="0.55" stop-color="#3f6212"/>
      <stop offset="1" stop-color="#1a2e05"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#65a30d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#65a30d" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bg)"/>
  <path d="M0 372 C 190 330, 330 400, 512 372 C 700 342, 850 402, 1024 366 L1024 500 L0 500 Z" fill="url(#hill)"/>

  <!-- logo tile -->
  <g transform="translate(74,158)">
    <rect width="184" height="184" rx="52" fill="#ffffff" opacity="0.14"/>
    <g transform="translate(92,96)">
      <path d="M0 44 L0 -12" stroke="#f4fbe8" stroke-width="13" stroke-linecap="round"/>
      <path d="M0 -6 C 2 -46, 30 -62, 56 -60 C 56 -30, 32 -6, 0 -6 Z" fill="#d9f99d"/>
      <path d="M0 12 C -2 -18, -26 -32, -48 -30 C -48 -6, -26 12, 0 12 Z" fill="#bef264"/>
      <path d="M-52 52 C -20 38, 20 38, 52 52" stroke="#eab308" stroke-width="13" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- wordmark + tagline -->
  <text x="308" y="216" font-family="Zilla Slab, Georgia, serif" font-size="92" font-weight="700" fill="#ffffff">AgroMall</text>
  <text x="312" y="272" font-family="Mulish, Segoe UI, Arial, sans-serif" font-size="31" font-weight="700" fill="#d9f99d">Farm supplies for Zambia</text>
  <text x="312" y="313" font-family="Mulish, Segoe UI, Arial, sans-serif" font-size="26" font-weight="600" fill="#ecfccb" opacity="0.85">Seeds &#183; Tools &#183; Fertilizer &#183; Irrigation</text>

  <!-- payment pill -->
  <g transform="translate(312,346)">
    <rect width="452" height="56" rx="28" fill="#eab308"/>
    <text x="30" y="37" font-family="Mulish, Segoe UI, Arial, sans-serif" font-size="25" font-weight="800" fill="#1a2e05">Pay with MTN &#183; Airtel &#183; Zamtel</text>
  </g>
</svg>
